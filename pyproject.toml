[project]
name = "rag-document-qa"
version = "0.0.1"
description = "Retrieval-augmented Q&A with measurable retrieval (Recall@K, MRR, nDCG against FinDER on SEC EDGAR)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umarfarook Gurramkonda", email = "umarfarook0yt@gmail.com" }]
keywords = ["rag", "retrieval", "evaluation", "finder", "edgar", "10-k", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=2.7",
    "torch>=2.1",
]
faiss = [
    "faiss-cpu>=1.8",
]
loaders = [
    "pdfplumber>=0.10",
    "pypdf2>=3.0",
]
all = [
    "rag-document-qa[embed,faiss,loaders]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
rag-document-qa = "rag_document_qa.cli:main"

[project.urls]
Homepage = "https://github.com/Umarfarook1/rag-document-qa"
Repository = "https://github.com/Umarfarook1/rag-document-qa"
Issues = "https://github.com/Umarfarook1/rag-document-qa/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*", "pdfplumber.*", "PyPDF2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "edgar: integration test that hits SEC EDGAR (no auth needed but slow + rate-limited). Run with `pytest -m edgar`.",
    "live: end-to-end test that hits real Anthropic API (requires ANTHROPIC_API_KEY). Run with `pytest -m live`.",
]
addopts = "-m 'not edgar and not live'"
