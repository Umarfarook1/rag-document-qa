name: Evals

on:
  workflow_dispatch:  # manual trigger from the Actions tab
  schedule:
    - cron: "0 7 * * 1"  # 07:00 UTC every Monday

jobs:
  retrieval-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the badge update back to main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Build EDGAR corpus
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::warning::SEC_USER_AGENT secret missing; skipping eval run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .cache/index
          rag-document-qa ingest \
            --tickers AAPL,MSFT,NVDA \
            --index-out .cache/index \
            --embedder bge \
            --index-kind faiss
        id: corpus

      - name: Run retrieval eval
        if: steps.corpus.outputs.skip != 'true'
        run: |
          if [ ! -f evals/golden_finder.jsonl ]; then
            echo "::warning::evals/golden_finder.jsonl missing; skipping"
            exit 0
          fi
          mkdir -p evals
          rag-document-qa evals run \
            --golden evals/golden_finder.jsonl \
            --index-in .cache/index \
            --embedder bge \
            --index-kind faiss \
            --report evals/latest.json \
            --badge-metric recall_at_5

      - name: Commit updated badge
        if: steps.corpus.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f evals/badge.json ]; then
            echo "No badge to commit (eval did not run)"
            exit 0
          fi
          if git diff --quiet evals/badge.json 2>/dev/null; then
            echo "Badge unchanged; nothing to commit."
          else
            git add evals/badge.json evals/latest.json
            git commit -m "evals: update retrieval badge from CI [skip ci]"
            git push
          fi
